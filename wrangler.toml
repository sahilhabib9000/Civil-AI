#:schema node_modules/wrangler/config-schema.json
name = "civil-ai-backend"
main = "worker/index.js"
compatibility_date = "2026-11-03"
workers_dev = true

[ai]
binding = "AI"

[previews.ai]
binding = "AI"

[[ratelimits]]
name = "AI_ASSISTANT_LIMITER"
namespace_id = "9001"

[ratelimits.simple]
limit = 10
period = 60
