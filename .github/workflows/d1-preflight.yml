name: CIVIL AI D1 Migration Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-ai-d1-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN GitHub Actions secret is missing or empty."
            exit 1
          fi
          response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if ! printf '%s' "$response" | jq -e '.success == true and .result.status == "active"' >/dev/null; then
            echo "::error::Cloudflare rejected the API token or reports it as inactive. Create a new active token and update the GitHub Actions secret CLOUDFLARE_API_TOKEN. Do not paste the token into chat."
            exit 1
          fi
          echo "Cloudflare API token is valid and active."

      - name: Inspect remote D1 migration status (read-only)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: d1 migrations list civil-ai_db --remote
