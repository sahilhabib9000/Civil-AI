name: CIVIL AI D1 Migration Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civil-ai-d1-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect remote D1 migration status (read-only)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: d1 migrations list civil-ai_db --remote
