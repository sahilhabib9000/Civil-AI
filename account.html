<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Account | CIVIL AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1220;color:#e2e8f0;font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(100%,520px);background:#172438;border:1px solid #30445d;border-radius:18px;padding:30px}
.brand{color:#38bdf8;font-size:22px;font-weight:bold}h1{margin:12px 0}p{color:#cbd5e1;line-height:1.6}
.tabs{display:flex;gap:10px;margin:22px 0}.tabs button,form button,#logout{border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer}
.tabs button{background:#263b55;color:#e2e8f0}.tabs button[aria-selected=true]{background:#0284c7;color:white}
label{display:block;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #64748b;border-radius:8px;font-size:16px}
form button,#logout{width:100%;margin-top:20px;background:#0284c7;color:white;font-size:16px}
#status{margin-top:18px;padding:14px;border-radius:9px;background:#0b1220;min-height:48px;color:#cbd5e1}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}a{color:#7dd3fc}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<div class="brand">CIVIL AI</div>
<h1>Your account</h1>
<p>Create an account or sign in. Email verification is required before Premium access can be enabled.</p>
<div class="tabs" role="tablist">
<button id="registerTab" type="button" aria-selected="true">Create account</button>
<button id="loginTab" type="button" aria-selected="false">Sign in</button>
</div>
<form id="registerForm">
<label for="registerEmail">Email</label><input id="registerEmail" type="email" autocomplete="email" required maxlength="254">
<label for="registerPassword">Password (12–128 characters)</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button type="submit">Create account</button>
</form>
<form id="loginForm" class="hidden">
<label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required maxlength="254">
<label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="128>
<button type="submit">Sign in</button>
</form>
<div id="status" role="status" aria-live="polite">Loading account status…</div>
<div id="signedIn" class="hidden">
<button id="resend" type="button">Resend verification email</button>
<button id="logout" type="button">Sign out</button>
</div>
<div class="links"><a href="/">Back to CIVIL AI</a><a href="/verify-email.html">Verify email help</a></div>
</main>
<script>
const API="https://civil-ai-backend.sahilhabib9000.workers.dev";
const $=id=>document.getElementById(id);
const statusBox=$("status");
function status(message){statusBox.textContent=message;}
async function api(path,body){
 const response=await fetch(API+path,{method:body===undefined?"GET":"POST",credentials:"include",headers:body===undefined?{}:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
 let data={};try{data=await response.json();}catch{}
 if(!response.ok)throw new Error(data.error||"Request failed. Please try again.");
 return data;
}
function selectTab(which){
 const register=which==="register";
 $("registerForm").classList.toggle("hidden",!register);
 $("loginForm").classList.toggle("hidden",register);
 $("registerTab").setAttribute("aria-selected",String(register));
 $("loginTab").setAttribute("aria-selected",String(!register));
}
$("registerTab").onclick=()=>selectTab("register");
$("loginTab").onclick=()=>selectTab("login");
$("registerForm").addEventListener("submit",async event=>{
 event.preventDefault();status("Creating your account and sending verification email…");
 try{const data=await api("/api/auth/register",{email:$("registerEmail").value,password:$("registerPassword").value});status(data.message||"Account created. Check your email.");$("signedIn").classList.remove("hidden");}
 catch(error){status(error.message);}
});
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();status("Signing in…");
 try{const data=await api("/api/auth/login",{email:$("loginEmail").value,password:$("loginPassword").value});status(data.user?.email_verified?"Signed in. Your email is verified.":"Signed in, but email verification is still required.");$("signedIn").classList.remove("hidden");}
 catch(error){status(error.message);}
});
$("resend").onclick=async()=>{
 const email=$("registerEmail").value||$("loginEmail").value;
 if(!email){status("Enter your email address in the form first.");return;}
 status("Requesting a verification email…");
 try{const data=await api("/api/auth/resend-verification",{email});status(data.message);}
 catch(error){status(error.message);}
};
$("logout").onclick=async()=>{
 try{await api("/api/auth/logout",{});status("You have signed out.");$("signedIn").classList.add("hidden");}
 catch(error){status(error.message);}
};
(async()=>{
 try{const data=await api("/api/auth/me");if(data.user){status("Signed in as "+data.user.email+(data.user.email_verified?" (verified).":" (email not verified)."));$("signedIn").classList.remove("hidden");}else status("You are not signed in.");}
 catch(error){status(error.message);}
})();
</script>
</body>
</html>
