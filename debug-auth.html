<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIVIL AI API Diagnostics</title>
<style>
body{font:16px Arial,sans-serif;background:#0b1220;color:#e2e8f0;padding:24px;max-width:760px;margin:auto}
main{background:#172438;border:1px solid #30445d;border-radius:14px;padding:22px}
button{display:block;margin:12px 0;padding:12px 18px;background:#0284c7;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#08111e;padding:14px;border-radius:8px;min-height:90px}
p{line-height:1.5;color:#cbd5e1}
</style></head><body><main>
<h1>CIVIL AI API diagnostics</h1>
<p>These diagnostics do not create an account or change account data. The registration probe deliberately uses an invalid email and short password, so it stops at validation.</p>
<button id="login">Test login API connection</button>
<button id="register">Test registration configuration (safe)</button>
<h3>Result</h3><pre id="result">Choose a test above.</pre>
<script>
const API="https://civil-ai-backend.sahilhabib9000.workers.dev";
async function run(path,body,label){
 const out=document.getElementById("result");out.textContent="Testing "+label+"…";
 try{
  const r=await fetch(API+path,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await r.text();
  out.textContent=label+"\nHTTP STATUS: "+r.status+"\nRESPONSE: "+data+"\nPAGE ORIGIN: "+location.origin;
 }catch(e){out.textContent=label+"\nBROWSER FETCH FAILED: "+String(e)+"\nPAGE ORIGIN: "+location.origin;}
}
document.getElementById("login").onclick=()=>run("/api/auth/login",{},"LOGIN API TEST");
document.getElementById("register").onclick=()=>run("/api/auth/register",{email:"invalid",password:"short"},"SAFE REGISTRATION CONFIGURATION TEST");
</script></main></body></html>
