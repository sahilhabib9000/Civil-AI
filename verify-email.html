<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Verify your email | CIVIL AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1220;color:#e2e8f0;font-family:Arial,sans-serif}
main{width:min(100%,480px);padding:32px;border:1px solid #30445d;border-radius:18px;background:#172438;text-align:center}
h1{color:#38bdf8}p{line-height:1.7;color:#cbd5e1}#status{margin:24px 0;padding:16px;border-radius:10px;background:#0b1220}a{color:#38bdf8}
</style>
</head>
<body>
<main>
<div style="font-weight:bold;color:#38bdf8;letter-spacing:1px">CIVIL AI</div>
<h1>Email verification</h1>
<p id="status" role="status" aria-live="polite">Checking your verification link…</p>
<p><a href="index.html">Return to CIVIL AI</a></p>
</main>
<script>
(async()=>{
 const status=document.getElementById("status");
 const token=new URLSearchParams(location.search).get("token")||"";
 if(token.length<32||token.length>128){status.textContent="This verification link is invalid. Please request a new email.";return;}
 try{
  const response=await fetch("https://civil-ai-backend.sahilhabib9000.workers.dev/api/auth/verify-email",{
   method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token}),credentials:"include"
  });
  const data=await response.json();
  status.textContent=response.ok&&data.verified?"Your email has been verified successfully. You can now sign in to CIVIL AI.":(data.error||"Verification failed. Please request a new link.");
 }catch{
  status.textContent="The verification service is temporarily unavailable. Please try again later.";
 }
 history.replaceState(null,"",location.pathname);
})();
</script>
</body>
</html>
